<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FitTrack — Daily Fitness Journal</title>
<style>
:root{--bg:#0b0d12;--card:#141821;--muted:#9299a8;--text:#f5f7fb;--line:#262c38;--accent:#9ef01a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18201a 0,#0b0d12 38%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:720px;margin:auto;padding:28px 18px 50px}.hero{padding:18px 0 24px}.eyebrow{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:42px;line-height:1;margin:10px 0 8px}.hero p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat,.card{background:rgba(20,24,33,.9);border:1px solid var(--line);border-radius:18px}.stat{padding:15px}.stat b{display:block;font-size:24px;margin-top:5px}.label{color:var(--muted);font-size:12px}.card{padding:18px;margin-top:12px}.card h2{font-size:17px;margin:0 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}textarea,input{width:100%;border:1px solid var(--line);background:#0e1118;color:var(--text);border-radius:12px;padding:12px;font:inherit;outline:none}textarea{min-height:92px;resize:vertical}button{width:100%;border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:var(--accent);color:#0a0d08;cursor:pointer}.secondary{margin-top:9px;background:#252b35;color:var(--text)}.summary{white-space:pre-wrap;line-height:1.55;color:#dfe3ea}.hint{font-size:12px;color:var(--muted);margin-top:10px}.saved{color:var(--accent);font-size:12px;margin-top:9px;min-height:18px}@media(max-width:520px){.hero h1{font-size:36px}.grid{grid-template-columns:1fr 1fr}.grid .stat:last-child{grid-column:1/-1}.row{grid-template-columns:1fr}}
</style></head>
<body><main>
<section class="hero"><div class="eyebrow">FitTrack</div><h1>Train. Eat. Recover.</h1><p>Your simple daily fitness journal.</p></section>
<section class="grid"><div class="stat"><span class="label">Workout</span><b id="sWorkout">—</b></div><div class="stat"><span class="label">Protein</span><b id="sProtein">—</b></div><div class="stat"><span class="label">Steps</span><b id="sSteps">—</b></div></section>
<section class="card"><h2>Log today</h2><div class="field"><label>Workout</label><textarea id="workout" placeholder="Bench 60kg × 10, 65kg × 8…"></textarea></div><div class="field"><label>Food</label><textarea id="food" placeholder="Eggs, chicken biryani, whey…"></textarea></div><div class="row"><div class="field"><label>Steps</label><input id="steps" type="number" placeholder="8000"></div><div class="field"><label>Water (L)</label><input id="water" type="number" step="0.1" placeholder="2.5"></div></div><div class="row"><div class="field"><label>Protein (g)</label><input id="protein" type="number" placeholder="140"></div><div class="field"><label>Calories</label><input id="calories" type="number" placeholder="2200"></div></div><button onclick="save()">Save today</button><div class="saved" id="saved"></div></section>
<section class="card"><h2>Daily summary</h2><div class="summary" id="summary">Log your day and tap “Generate summary”.</div><button class="secondary" onclick="summarize()">Generate summary</button><div class="hint">This browser version stores your log locally on this device.</div></section>
</main>
<script>
const key='fittrack:'+new Date().toISOString().slice(0,10); const $=id=>document.getElementById(id);
function load(){try{const d=JSON.parse(localStorage.getItem(key)||'{}');['workout','food','steps','water','protein','calories'].forEach(k=>$(k).value=d[k]??'');render(d)}catch(e){}}
function render(d){$('sWorkout').textContent=d.workout?'Logged':'—';$('sProtein').textContent=d.protein?d.protein+'g':'—';$('sSteps').textContent=d.steps?Number(d.steps).toLocaleString():'—'}
function data(){return Object.fromEntries(['workout','food','steps','water','protein','calories'].map(k=>[k,$(k).value.trim()]))}
function save(){const d=data();localStorage.setItem(key,JSON.stringify(d));render(d);$('saved').textContent='Saved locally ✓';setTimeout(()=>$('saved').textContent='',1800)}
function summarize(){const d=data();const lines=[];lines.push('TODAY’S CHECK-IN');lines.push('');lines.push(d.workout?'Training: '+d.workout:'Training: not logged');lines.push(d.food?'Food: '+d.food:'Food: not logged');if(d.protein)lines.push('Protein: '+d.protein+' g');if(d.calories)lines.push('Calories: '+d.calories);if(d.steps)lines.push('Steps: '+Number(d.steps).toLocaleString());if(d.water)lines.push('Water: '+d.water+' L');lines.push('');let wins=[];if(d.workout)wins.push('Workout logged');if(d.protein)wins.push('Protein tracked');if(d.steps&&Number(d.steps)>=8000)wins.push('Strong movement');lines.push('WINS: '+(wins.length?wins.join(' • '):'Start by logging one thing.'));let gaps=[];if(!d.workout)gaps.push('training');if(!d.food)gaps.push('food');if(!d.protein)gaps.push('protein');if(!d.steps)gaps.push('steps');lines.push('GAPS: '+(gaps.length?gaps.join(', '):'Nothing obvious — keep the streak going.'));lines.push('');lines.push('NEXT MOVE: '+(d.workout?'Prioritize recovery, hydration, and a solid protein-rich meal.':'Log your workout, even if it is a short session.'));$('summary').textContent=lines.join('\n')}
load();
</script></body></html>
