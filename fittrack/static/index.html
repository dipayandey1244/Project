<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitTrack</title><style>
:root{font-family:Inter,system-ui,sans-serif;background:#f6f7f9;color:#15171a}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:28px;font-weight:800}.muted{color:#6d737c}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #00000008}h2{margin:0 0 12px}label{display:block;font-weight:650;margin:10px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #d9dce1;border-radius:12px;font:inherit}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f3f5f7;border-radius:14px;padding:14px}.num{font-size:24px;font-weight:800}button{border:0;border-radius:12px;padding:12px 16px;font-weight:750;cursor:pointer;background:#15171a;color:white;margin-top:12px}.secondary{background:#eef0f2;color:#15171a}.summary{white-space:pre-wrap;line-height:1.55}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef6ff;margin:2px;font-size:13px}@media(max-width:560px){.grid,.stats{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head><body><main class="wrap"><div class="top"><div><div class="brand">FitTrack</div><div class="muted">Your daily training + nutrition journal</div></div><div id="date"></div></div>
<div class="card"><h2>Today</h2><div class="stats"><div class="stat"><div class="muted">Workout</div><div class="num" id="workoutStat">—</div></div><div class="stat"><div class="muted">Protein</div><div class="num" id="proteinStat">—</div></div><div class="stat"><div class="muted">Calories</div><div class="num" id="calStat">—</div></div></div></div>
<div class="card"><h2>Log your day</h2><label>Workout</label><textarea id="workout" placeholder="e.g. Push: bench 60kg x10, 65kg x8; incline DB 20kg x10 x3; 50 min"></textarea><label>Food</label><textarea id="food" placeholder="e.g. 3 eggs, poha, chicken biryani, whey shake"></textarea><div class="grid"><div><label>Steps</label><input id="steps" type="number" placeholder="8000"></div><div><label>Water (L)</label><input id="water" type="number" step="0.1" placeholder="2.5"></div><div><label>Protein (g, if known)</label><input id="protein" type="number" placeholder="120"></div><div><label>Calories (if known)</label><input id="calories" type="number" placeholder="2200"></div></div><button onclick="saveDay()">Save today's log</button><button class="secondary" onclick="getSummary()">Generate AI daily summary</button></div>
<div class="card"><h2>Daily summary</h2><div id="summary" class="summary muted">Save your day, then generate your summary.</div></div>
<div class="card"><h2>Design principle</h2><span class="pill">Fast logging</span><span class="pill">Natural language</span><span class="pill">AI coaching</span><span class="pill">Trend-ready</span></div></main>
<script>
const day=new Date().toISOString().slice(0,10); document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
let current={date:day,workout:'',food:'',steps:'',water:'',protein:'',calories:''};
async function load(){try{const r=await fetch('/api/data');const d=await r.json();if(d[day]){current=d[day];for(const k of ['workout','food','steps','water','protein','calories'])document.getElementById(k).value=current[k]||'';render()}}catch(e){}}
function render(){document.getElementById('workoutStat').textContent=current.workout?'Logged':'—';document.getElementById('proteinStat').textContent=current.protein?current.protein+'g':'—';document.getElementById('calStat').textContent=current.calories||'—'}
async function saveDay(){for(const k of ['workout','food','steps','water','protein','calories'])current[k]=document.getElementById(k).value;current.date=day;await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(current)});render();document.getElementById('summary').textContent='Saved. Generate the AI summary when ready.'}
async function getSummary(){await saveDay();document.getElementById('summary').textContent='Generating…';const r=await fetch('/api/summary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(current)});const d=await r.json();document.getElementById('summary').textContent=d.summary||d.error||'Could not generate summary.'}
load();
</script></body></html>
